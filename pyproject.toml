[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "allos"
version = "0.1.0"
description = "Storage and visualization of long read based single cell datasets"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "Anna Diamant", email = "diamant.anya@gmail.com"}]
keywords = ["nbdev", "jupyter", "notebook", "python", "single-cell", "isoform", "long-read"]
dependencies = [
    "scanpy", "scipy", "muon", "anndata", "matplotlib", "seaborn",
    "requests", "patchworklib", "numpy", "pandas", "fastcore",
    "pyranges", "pyfaidx", "jinja2", "plotly", "intervaltree",
    "joblib", "tqdm", "statsmodels", "pysam", "networkx",
    "trackplot", "loguru", "edgepython", "adjustText", "numba"
]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/cobioda/allos"
Documentation = "https://cobioda.github.io/allos"

[tool.nbdev]
doc_path = "_docs"
lib_path = "allos"
nbs_path = "nbs"
recursive = true
tst_flags = "notest"
put_version_in_init = true
branch = "main"
doc_host = "https://cobioda.github.io"
doc_baseurl = "/allos"
git_url = "https://github.com/cobioda/allos"
title = "allos"
